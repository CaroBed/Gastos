<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gastos</title>
  <style>
    :root {
      --purple-light: #EEEDFE;
      --purple-mid: #AFA9EC;
      --purple: #7F77DD;
      --purple-dark: #534AB7;
      --purple-darker: #3C3489;
      --green-light: #E1F5EE;
      --green-mid: #5DCAA5;
      --green-dark: #085041;
      --bg: #F8F8F6;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.10);
      --border-med: rgba(0,0,0,0.18);
      --text: #1A1A18;
      --text-sec: #5F5E5A;
      --text-ter: #888780;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --purple-light: #2A2660;
        --purple-mid: #6B65B8;
        --purple: #9990E8;
        --purple-dark: #BAB4F4;
        --purple-darker: #CECBF6;
        --green-light: #0A2E22;
        --green-mid: #1D9E75;
        --green-dark: #9FE1CB;
        --bg: #141412;
        --surface: #1E1E1C;
        --border: rgba(255,255,255,0.10);
        --border-med: rgba(255,255,255,0.18);
        --text: #F0EFE8;
        --text-sec: #B4B2A9;
        --text-ter: #888780;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      padding: 56px 20px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .user-toggle { display: flex; gap: 6px; }

    .user-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 0.5px solid var(--border-med);
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-sec);
      transition: all 0.15s;
    }

    .user-btn.active-caro {
      background: var(--purple-light);
      border-color: var(--purple-mid);
      color: var(--purple-darker);
    }

    .user-btn.active-lucas {
      background: var(--green-light);
      border-color: var(--green-mid);
      color: var(--green-dark);
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-ter);
    }

    .header-sub span {
      color: var(--text-sec);
      font-weight: 500;
    }

    /* TABS */
    .tabs {
      display: flex;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 97px;
      z-index: 9;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-ter);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab-btn.active {
      color: var(--purple);
      border-bottom-color: var(--purple);
    }

    /* PANELS */
    .panel { display: none; padding: 20px; flex-direction: column; gap: 16px; }
    .panel.active { display: flex; }

    /* FIELDS */
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-ter);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 6px;
    }

    /* AMOUNT */
    .amount-wrap { position: relative; }

    .currency {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      font-weight: 500;
      color: var(--text-sec);
      pointer-events: none;
    }

    .amount-input {
      width: 100%;
      padding: 14px 14px 14px 32px;
      font-size: 30px;
      font-weight: 600;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    .amount-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(127,119,221,0.12);
    }

    .amount-input::placeholder {
      color: var(--text-ter);
      font-weight: 400;
      font-size: 26px;
    }

    /* CATEGORY GRID */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .cat-btn {
      padding: 10px 4px 9px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border);
      background: var(--bg);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.12s;
      line-height: 1.25;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .cat-btn:active { transform: scale(0.96); }

    .cat-btn.selected {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      color: var(--purple-darker);
    }

    .cat-icon { font-size: 18px; line-height: 1; }

    /* DETAIL */
    .detail-input {
      width: 100%;
      padding: 11px 13px;
      font-size: 15px;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text);
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .detail-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(127,119,221,0.12);
    }

    .detail-input::placeholder { color: var(--text-ter); }

    /* META ROW */
    .meta-row {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 10px 13px;
      background: var(--bg);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-sec);
    }

    .meta-row strong { color: var(--text); font-weight: 500; }
    .meta-sep { color: var(--border-med); }

    /* SUBMIT */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: none;
      background: var(--purple);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: -0.2px;
    }

    .submit-btn:hover { background: var(--purple-dark); }
    .submit-btn:active { transform: scale(0.98); background: var(--purple-dark); }

    /* RECENTS */
    .recents-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-ter);
      margin-bottom: 4px;
    }

    .expense-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 0.5px solid var(--border);
    }

    .expense-item:last-child { border-bottom: none; }

    .exp-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .exp-info { flex: 1; min-width: 0; }

    .exp-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .exp-left { display: flex; align-items: center; gap: 5px; min-width: 0; }

    .exp-cat {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exp-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
    }

    .exp-detail {
      font-size: 12px;
      color: var(--text-ter);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .badge-caro { background: var(--purple-light); color: var(--purple-darker); }
    .badge-lucas { background: var(--green-light); color: var(--green-dark); }

    /* STATUS */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .status-ok { background: #1D9E75; }
    .status-err { background: #E24B4A; }
    .status-pending { background: #EF9F27; }

    .sync-status {
      font-size: 12px;
      color: var(--text-ter);
      display: flex;
      align-items: center;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--purple-darker);
      color: #fff;
      padding: 11px 22px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .empty {
      font-size: 14px;
      color: var(--text-ter);
      text-align: center;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-row">
      <div class="app-title">Gastos 💸</div>
      <div class="user-toggle">
        <button class="user-btn active-caro" id="btn-caro" onclick="setUser('Caro')">Caro</button>
        <button class="user-btn" id="btn-lucas" onclick="setUser('Lucas')">Lucas</button>
      </div>
    </div>
    <div class="header-sub">Anotando como <span id="user-label">Caro</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('form')">Nuevo gasto</button>
    <button class="tab-btn" onclick="showTab('recents')" id="tab-recents">Últimos</button>
  </div>

  <!-- FORM PANEL -->
  <div class="panel active" id="panel-form">

    <div>
      <div class="field-label">Monto</div>
      <div class="amount-wrap">
        <span class="currency">$</span>
        <input class="amount-input" type="text" id="amount-input" placeholder="0" inputmode="numeric" />
      </div>
    </div>

    <div>
      <div class="field-label">Categoría</div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>

    <div>
      <div class="field-label">Detalle</div>
      <textarea class="detail-input" id="detail-input" rows="2" placeholder="Descripción opcional..."></textarea>
    </div>

    <div class="meta-row">
      <span>📅 <strong id="date-label"></strong></span>
      <span class="meta-sep">·</span>
      <span>👤 <strong id="who-meta">Caro</strong></span>
      <span class="meta-sep">·</span>
      <span class="sync-status"><span class="status-dot status-ok" id="status-dot"></span><span id="status-text">Conectado</span></span>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitExpense()">Guardar gasto</button>

  </div>

  <!-- RECENTS PANEL -->
  <div class="panel" id="panel-recents">
    <div class="recents-title">Últimos 20 gastos</div>
    <div id="recents-list"><div class="empty">Aún no hay gastos registrados</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyv4g_0clGTSG1UBJ96f-m6ByDwA9_FoBgB8MeFc2uz46xODKEQDCxZ16O1f8-Hza1g6g/exec';

  const CATS = [
    { id: 'Ahorro',              label: 'Ahorro',       icon: '🏦' },
    { id: 'Arca',                label: 'Arca',         icon: '📦' },
    { id: 'Autos',               label: 'Autos',        icon: '🚗' },
    { id: 'Carniceria',          label: 'Carnicería',   icon: '🥩' },
    { id: 'Casa',                label: 'Casa',         icon: '🏠' },
    { id: 'Compras Cosas',       label: 'Compras',      icon: '🛍️' },
    { id: 'Deporte/Actividades', label: 'Deporte-Activ',      icon: '🏃' },
    { id: 'Donaciones',          label: 'Donaciones',       icon: '🫂' },
    { id: 'Domtek',              label: 'Domtek',       icon: '🔧' },
    { id: 'Farmacia',            label: 'Farmacia',     icon: '💊' },
    { id: 'Impuestos/Renta',     label: 'Impuestos',    icon: '🧾' },
    { id: 'Ingreso',             label: 'Ingreso',      icon: '💰' },
    { id: 'Juntadas Amigos',     label: 'Juntadas',     icon: '🥂' },
    { id: 'Olivia',              label: 'Olivia',       icon: '🐶' },
    { id: 'Ocio',                label: 'Ocio',         icon: '🎭' },
    { id: 'Regalos',             label: 'Regalos',      icon: '🎁' },
    { id: 'Restaurantes',        label: 'Restaurantes', icon: '🍽️' },
    { id: 'Romi Limpieza',       label: 'Romi',         icon: '🧹' },
    { id: 'Salud/Belleza',       label: 'Salud',        icon: '💆' },
    { id: 'Servicios',           label: 'Servicios',    icon: '⚡' },
    { id: 'Supermercado',        label: 'Súper',        icon: '🛒' },
    { id: 'Tarjetas',            label: 'Tarjetas',     icon: '💳' },
    { id: 'Verduleria',          label: 'Verdulería',   icon: '🥦' },
    { id: 'Viajes',              label: 'Viajes',       icon: '✈️' },
  ];

  let currentUser = 'Caro';
  let selectedCat = null;
  let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
  let activeTab = 'form';

  function formatDate(d) {
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }

  function formatDateFull(d) {
    return new Date(d).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  document.getElementById('date-label').textContent = formatDate(new Date());

  const amountInput = document.getElementById('amount-input');
  amountInput.addEventListener('input', () => {
  let val = amountInput.value;
  const startsWithMinus = val.startsWith('-');
  const raw = val.replace(/[-\.]/g, '').replace(/\D/g, '');
  if (raw === '') { amountInput.value = startsWithMinus ? '-' : ''; return; }
  amountInput.value = (startsWithMinus ? '-' : '') + Number(raw).toLocaleString('es-AR');
});

  function getRawAmount() {
    const clean = amountInput.value.replace(/\./g, '');
    return parseFloat(clean) || 0;
  }

  function setUser(name) {
    currentUser = name;
    document.getElementById('user-label').textContent = name;
    document.getElementById('who-meta').textContent = name;
    document.getElementById('btn-caro').className = 'user-btn' + (name === 'Caro' ? ' active-caro' : '');
    document.getElementById('btn-lucas').className = 'user-btn' + (name === 'Lucas' ? ' active-lucas' : '');
    localStorage.setItem('lastUser', name);
  }

  function showTab(tab) {
    activeTab = tab;
    document.getElementById('panel-form').classList.toggle('active', tab === 'form');
    document.getElementById('panel-recents').classList.toggle('active', tab === 'recents');
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'form') || (i === 1 && tab === 'recents'));
    });
    if (tab === 'recents') renderRecents();
  }

  function renderCats() {
    const grid = document.getElementById('cat-grid');
    grid.innerHTML = '';
    CATS.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (selectedCat === cat.id ? ' selected' : '');
      btn.innerHTML = `<span class="cat-icon">${cat.icon}</span><span>${cat.label}</span>`;
      btn.onclick = () => { selectedCat = cat.id; renderCats(); };
      grid.appendChild(btn);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function setStatus(state) {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (state === 'ok') { dot.className = 'status-dot status-ok'; txt.textContent = 'Conectado'; }
    else if (state === 'err') { dot.className = 'status-dot status-err'; txt.textContent = 'Sin conexión'; }
    else { dot.className = 'status-dot status-pending'; txt.textContent = 'Enviando...'; }
  }

  function renderRecents() {
    const list = document.getElementById('recents-list');
    if (!expenses.length) {
      list.innerHTML = '<div class="empty">Aún no hay gastos registrados</div>';
      return;
    }
    list.innerHTML = expenses.slice().reverse().slice(0, 20).map(e => {
      const cat = CATS.find(c => c.id === e.cat) || { icon: '📦', label: e.cat };
      const bc = e.who === 'Caro' ? 'badge-caro' : 'badge-lucas';
      const detail = e.detail ? e.detail : formatDateFull(e.ts);
      return `<div class="expense-item">
        <div class="exp-icon">${cat.icon}</div>
        <div class="exp-info">
          <div class="exp-top">
            <div class="exp-left">
              <span class="exp-cat">${cat.label}</span>
              <span class="badge ${bc}">${e.who}</span>
            </div>
            <span class="exp-amount">$${Number(e.amount).toLocaleString('es-AR')}</span>
          </div>
          <div class="exp-detail">${detail}</div>
        </div>
      </div>`;
    }).join('');
  }

  async function submitExpense() {
    const amount = getRawAmount();
    if (amount === 0) { showToast('Ingresá un monto'); return; }
    if (!selectedCat) { showToast('Elegí una categoría'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    setStatus('pending');

    const expense = {
      amount: amount,
      cat: selectedCat,
      detail: document.getElementById('detail-input').value.trim(),
      date: formatDate(new Date()),
      who: currentUser,
      ts: new Date().toISOString()
    };

    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(expense)
      });
      setStatus('ok');
      showToast('✓ Gasto guardado en el Sheet');
    } catch (err) {
      setStatus('err');
      showToast('Sin conexión — guardado localmente');
    }

    expenses.push(expense);
    localStorage.setItem('expenses', JSON.stringify(expenses.slice(-200)));

    amountInput.value = '';
    document.getElementById('detail-input').value = '';
    selectedCat = null;
    renderCats();

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = 'Guardar gasto';
    }, 2000);
  }

  // Restore last user
  const lastUser = localStorage.getItem('lastUser');
  if (lastUser) setUser(lastUser);

  renderCats();
</script>
</body>
</html>
